name: Site checks

# Read-only checks of each project's live site. Never signs in, never submits forms, never pays.
# Daily: pages load, prices match the knowledge base, the paid call-to-action leads to sign-up.
# Weekly (Mondays): Lighthouse scores for key pages (report only, never fails the run).
on:
  schedule:
    - cron: "17 14 * * *"   # daily 14:17 UTC (6:17 AM PT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # GitHub's Ubuntu runners include Google Chrome: no browser download, no apt installs.
      CHROME_PATH: /usr/bin/google-chrome
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright library only (not the app's dependencies)
        run: |
          PW=$(node -p "require('./package.json').devDependencies.playwright")
          npm --prefix /tmp/pw install --no-audit --no-fund --silent "playwright@$PW"
          ln -s /tmp/pw/node_modules node_modules
      - name: Site checks (both projects, one job)
        run: |
          status=0
          for project in hatchelite eva-video-studio; do
            node scripts/site-checks.mjs "$project" --report "report-$project.md" || status=1
            cat "report-$project.md" >> "$GITHUB_STEP_SUMMARY" || true
          done
          exit $status
      - name: Lighthouse (Mondays and manual runs; report only)
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule != '')
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "1" ]; then echo "Not Monday, skipping"; exit 0; fi
          for PROJECT in hatchelite eva-video-studio; do
            BASE=$(node -p "require('./projects/$PROJECT/site-checks.json').baseUrl")
            { echo "### $PROJECT Lighthouse"; echo "| Page | Performance | Accessibility | Best practices | SEO |"; echo "| --- | --- | --- | --- | --- |"; } >> "$GITHUB_STEP_SUMMARY"
            for path in $(node -p "require('./projects/$PROJECT/site-checks.json').lighthouse.join(' ')"); do
              npx --yes lighthouse@12 "$BASE$path" --quiet --output=json --output-path=lh.json --chrome-flags="--headless=new --no-sandbox" || continue
              node -e "const r=require('./lh.json').categories;const s=k=>Math.round(r[k].score*100);console.log('| \`$path\` | '+[s('performance'),s('accessibility'),s('best-practices'),s('seo')].join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY"
            done
          done
