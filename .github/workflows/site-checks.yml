name: Site checks

# Read-only checks of each project's live site. Never signs in, never submits forms, never pays.
# Daily: pages load, prices match the knowledge base, the paid call-to-action leads to sign-up.
# Weekly (Mondays): Lighthouse scores for key pages (report only, never fails the run).
on:
  schedule:
    - cron: "17 14 * * *"   # daily 14:17 UTC (6:17 AM PT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [hatchelite, eva-video-studio]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check ${{ matrix.project }}
        run: node scripts/site-checks.mjs ${{ matrix.project }} --report report.md
      - name: Summary
        if: always()
        run: cat report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Lighthouse (Mondays and manual runs)
        if: always()
        continue-on-error: true
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "1" ]; then echo "Not Monday, skipping"; exit 0; fi
          CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          export CHROME_PATH
          BASE=$(node -e "console.log(require('./projects/$PROJECT/site-checks.json').baseUrl)")
          echo "### $PROJECT Lighthouse" >> "$GITHUB_STEP_SUMMARY"
          echo "| Page | Performance | Accessibility | Best practices | SEO |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for path in $(node -e "console.log(require('./projects/$PROJECT/site-checks.json').lighthouse.join(' '))"); do
            npx --yes lighthouse@12 "$BASE$path" --quiet --output=json --output-path=lh.json \
              --chrome-flags="--headless=new --no-sandbox" || continue
            node -e "const r=require('./lh.json').categories;const s=k=>Math.round(r[k].score*100);console.log('| \`$path\` | '+[s('performance'),s('accessibility'),s('best-practices'),s('seo')].join(' | ')+' |')" >> "$GITHUB_STEP_SUMMARY"
          done
