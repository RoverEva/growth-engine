# Growth Engine CI: lint, typecheck, unit tests, database tests on a real
# Postgres (row-level security, approval gate), and a production build.
name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "projects/**/*.md", "*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "projects/**/*.md", "*.md"]

# One run per PR: a new push cancels the previous run (saves Actions minutes).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: seo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and database tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/seo_test
      - name: Build
        run: npm run build
